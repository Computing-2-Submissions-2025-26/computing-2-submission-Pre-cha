<!doctype html>  <!-- This first line tells browsers to expect modern standard html 5 -->
<html lang="en-gb"> <!-- This is indicates the page is written in British English, useful for accessibility -->
<head>
    <meta charset="utf-8"> <!-- This indicates how the file is encoded. utf-8 is standard -->
    <title>Pinic Panick</title>
    <link rel="stylesheet" href="default.css"> <!-- Import style sheet – default.css -->
    <link rel="icon" href="./assets/favicon.png"> <!-- Import 'Favorites Icon' – favicon.png -->
    <script type="module" src="main.js"></script> <!-- Load the main script. Must be type="module". Have only one of these -->
</head>

<body>
    <aside id= "sidebar">
        <h1>Pinic Panic</h1>
        <h2>Instructions:</h2>
        <p>Find the matching tile in front of you
            to move forward. Overtake the other
            player to win! You're moving
            clockwise around the board.
            Peer Review: Go find a friend
            to play this with please.
        </p>
        <h3>Current Turn</h3>
            <p id = "current_turn"></p>
            <h4>Stats</h4>
            <p id="blue_streak"></p>
            <p id="red_streak"></p>
            <p id="player1_wins"></p>
            <p id="player2_wins"></p>
            <img id="current_player_drawing" src="./assets/bluegirl.png" alt=""Current player">
            <p id = "looking_for"></p>
    
        
    </aside>

    <main>
        <div id= "game-area">
            <div id = "walking-board"></div>
            <section id = "centre-board">
                <div id = "matching-board"></div>
                <button id = "reset">Reset</button>
                <p id = "message"></p>
            </section>
        </div>
    </main>
</body>
</html>
