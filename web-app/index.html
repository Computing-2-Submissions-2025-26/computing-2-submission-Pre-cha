<!doctype html> <!-- This first line tells browsers to expect modern standard html 5 -->
<html lang="en-gb"> <!-- This is indicates the page is written in British English, useful for accessibility -->
<head>
    <meta charset="utf-8"> <!-- This indicates how the file is encoded. utf-8 is standard -->
    <title>Picnic Panick</title>
    <link rel="stylesheet" href="default.css"> <!-- Import style sheet – default.css -->
    <link rel="icon" href="./assets/favicon.png"> <!-- Import 'Favorites Icon' – favicon.png -->
    <script type="module" src="main.js"></script> <!-- Load the main script. Must be type="module". Have only one of these -->
</head>
<body>
    <aside id="sidebar">
        <div id="title_logo">
            <h1>Picnic Panic</h1>
            <img src="./assets/picnic_logo.png" alt="Picnic Panic logo">
        </div>

        <section id="instructions_panel">
            <h2>Instructions:</h2>
            <p>
                Fiona and Carl are racing to see who
                can eat their way around the table first!
            </p>
            <p>
                Match the correct tile to the tile in front
                of you to move forward. Overtake the other to win.
            </p>
        </section>

        <section id="info_columns">
            <section id="turn_panel">
                <h3>Current Turn</h3>

                <div id="turn_content">
                    <div id="current_player_avatar">
                        <img
                            id="current_player_drawing"
                            src="./assets/blue_girl.png"
                            alt="Current player"
                        >
                    </div>

                    <p id="current_turn"></p>
                </div>
            </section>

            <section id="stats_panel">
                <h3>Stats</h3>
                <p id="blue_streak"></p>
                <p id="red_streak"></p>
                <p id="player1_wins"></p>
                <p id="player2_wins"></p>
                <p id="best_streak"></p>
            </section>
        </section>
    </aside>

    <main>
        <div id="game-area">
            <div id="walking-board"></div>

            <section id="centre-board">
                <div id="matching-board"></div>
                <button id="reset">Reset</button>
                <p id="message"></p>
            </section>
        </div>
    </main>

    <audio id="background_music" src="./assets/bg_music.mp3" loop></audio>
    <audio id="correct_sound" src="./assets/correct_sound.mp3"></audio>
    <audio id="wrong_sound" src="./assets/wrong_sound.mp3"></audio>
    <audio id="winner_sound" src="./assets/winner_sound.mp3"></audio>
    <audio id="button_sound" src="./assets/button_sound.mp3"></audio>

    <div id="winner_popup" class="hidden">
        <div id="winner_box">
            <p id="winner_text"></p>
            <button id="winner_close">OK</button>
        </div>
    </div>
</body>
</html>
